<template id="shot-01-open-template">
  <div id="s01-root" data-composition-id="shot-01-open" data-width="1920" data-height="1080" data-duration="6">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;
        src:url(fonts/Inter-latin-variable.woff2) format('woff2')}

      #s01-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;
        font-family:'Inter var',system-ui,sans-serif;color:#F4F8FF;
        -webkit-font-smoothing:antialiased}
      #s01-root *,#s01-root *::before,#s01-root *::after{box-sizing:border-box}

      #s01-root .frame{position:absolute;inset:0;perspective:1400px}
      #s01-root .mark{position:absolute;left:0;right:0;top:236px;text-align:center}
      #s01-root .word{display:inline-block;font-size:214px;font-weight:600;letter-spacing:-.05em;
        line-height:.9;text-shadow:0 26px 70px rgba(3,10,26,.45)}
      #s01-root .word span{display:inline-block;will-change:transform}
      #s01-root .by{margin-top:20px;display:flex;justify-content:center;align-items:center;gap:16px;
        font-size:26px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
        color:rgba(238,245,255,.82)}
      /* supplied WZRD.tech chrome blackletter mark (white bg knocked out) */
      #s01-root .by img{height:44px;width:auto;display:block;
        filter:drop-shadow(0 8px 22px rgba(3,10,26,.55))}
      #s01-root .hero{position:absolute;left:50%;top:520px;width:1180px;margin-left:-590px;
        text-align:center;font-size:38px;font-weight:450;line-height:1.42;color:rgba(240,246,255,.94);
        text-shadow:0 10px 34px rgba(3,10,26,.5)}
      #s01-root .hero b{font-weight:650;color:#FFFFFF}

      #s01-root .tiles{position:absolute;left:170px;right:170px;top:742px;display:flex;
        justify-content:space-between}
      #s01-root .tile{width:212px;text-align:center;will-change:transform}
      #s01-root .card{position:relative;width:132px;height:132px;margin:0 auto;border-radius:32px;
        background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.10));
        border:1px solid rgba(255,255,255,.34);
        box-shadow:0 30px 60px -18px rgba(4,10,26,.62),inset 0 1px 0 rgba(255,255,255,.55);
        backdrop-filter:blur(14px);display:grid;place-items:center}
      #s01-root .card img{width:66px;height:66px;display:block}
      #s01-root .cap{margin-top:20px;font-size:22px;font-weight:500;line-height:1.28;
        color:rgba(236,243,255,.9);text-shadow:0 6px 20px rgba(3,10,26,.55)}
    </style>

    <div class="frame clip" id="s01-frame" data-layout-allow-overflow data-start="0" data-duration="6" data-track-index="1">
      <div class="mark">
        <div class="word" id="s01-word"><span>a</span><span>i</span><span>r</span></div>
        <div class="by" id="s01-by">by <img src="logos/wzrdtech-chrome.png" alt="WZRD.tech"></div>
      </div>

      <div class="hero" id="s01-hero">
        Your personal agent — its own <b>number</b>, its own <b>inbox</b>, and its own
        <b>computer</b>. Tied to exactly one person: you.
      </div>

      <div class="tiles" id="s01-tiles">
        <div class="tile"><div class="card"><img src="logos/imessage.svg" alt=""></div><div class="cap">texts you back</div></div>
        <div class="tile"><div class="card"><img src="logos/gmail.svg" alt=""></div><div class="cap">clears the inbox</div></div>
        <div class="tile"><div class="card"><img src="logos/calendar.svg" alt=""></div><div class="cap">holds the slot</div></div>
        <div class="tile"><div class="card"><img src="logos/chrome.svg" alt=""></div><div class="cap">keeps your profile</div></div>
        <div class="tile"><div class="card"><img src="logos/spotify.svg" alt=""></div><div class="cap">knows your taste</div></div>
        <div class="tile"><div class="card"><img src="logos/shopify.svg" alt=""></div><div class="cap">runs the shop</div></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-01-open"]');
      var frame = root.querySelector('#s01-frame');
      var letters = root.querySelectorAll('#s01-word span');
      var by = root.querySelector('#s01-by');
      var hero = root.querySelector('#s01-hero');
      var tiles = root.querySelectorAll('#s01-tiles .tile');
      var caps = root.querySelectorAll('#s01-tiles .cap');
      var EO = 'expo.out';

      gsap.set(frame,{opacity:0,scale:1.08,transformOrigin:'50% 46%'});
      gsap.set(letters,{yPercent:112,opacity:0});
      gsap.set([by,hero],{y:34,opacity:0});
      gsap.set(tiles,{y:96,opacity:0,scale:.84,rotateX:-26,transformOrigin:'50% 100%'});
      gsap.set(caps,{y:16,opacity:0});

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});

      // film open: inverse-zoom arrival — the frame retracts into the focal plane
      tl.to(frame,{opacity:1,scale:1,duration:1.1},0);
      // wordmark: waterfall entry from below, binary opacity, gaps shrinking
      tl.to(letters,{yPercent:0,opacity:1,duration:.52,stagger:{each:.085,from:'start'}},.30);
      tl.to(by,{y:0,opacity:1,duration:.7},.86);
      tl.to(hero,{y:0,opacity:1,duration:.85},1.16);

      // app tiles: staggered 3D arrival, soft shadow already baked in CSS
      tiles.forEach(function(t,i){
        var at = 1.90 + i*.20;
        tl.to(t,{y:0,opacity:1,scale:1,rotateX:0,duration:.72},at);
        tl.to(caps[i],{y:0,opacity:1,duration:.5},at+.16);
      });

      // stillness, then the whole composed frame drifts LEFT and the cut lands mid-motion
      tl.to(frame,{x:-38,duration:1.9,ease:'sine.inOut'},3.60);
      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},5.66);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},5.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-01-open"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
