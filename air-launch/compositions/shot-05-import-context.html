<template id="shot-05-import-context-template">
  <div id="s05-root" data-composition-id="shot-05-import-context" data-width="1920" data-height="1080" data-duration="8.5">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;
        src:url(fonts/Inter-latin-variable.woff2) format('woff2')}

      #s05-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050810;
        font-family:'Inter var',system-ui,sans-serif;color:#EDF3FF;
        -webkit-font-smoothing:antialiased}
      #s05-root *,#s05-root *::before,#s05-root *::after{box-sizing:border-box}

      #s05-root .frame{position:absolute;inset:0;background:
        radial-gradient(58% 58% at 74% 46%,rgba(52,118,190,.30) 0%,rgba(5,8,16,0) 70%),
        radial-gradient(60% 50% at 8% 88%,rgba(96,80,196,.22) 0%,rgba(5,8,16,0) 72%),
        #050810}

      #s05-root .head{position:absolute;left:150px;top:214px;width:600px}
      #s05-root .num{font-size:26px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#A9C6FF}
      #s05-root .title{margin-top:26px;font-size:92px;font-weight:600;letter-spacing:-.04em;line-height:1.04}
      #s05-root .rule{margin-top:36px;width:180px;height:3px;
        background:linear-gradient(90deg,rgba(169,198,255,.95),rgba(169,198,255,0))}
      #s05-root .sub{margin-top:34px;font-size:31px;font-weight:450;line-height:1.45;color:rgba(226,236,255,.78)}

      #s05-root .diagram{position:absolute;left:880px;top:150px;width:920px;height:800px}
      #s05-root .wires{position:absolute;left:0;top:0;width:920px;height:800px}
      #s05-root .src{position:absolute;left:0;width:330px;height:92px;border-radius:24px;
        display:flex;align-items:center;gap:20px;padding:0 24px;
        background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
        border:1px solid rgba(255,255,255,.20);
        box-shadow:0 22px 46px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.32);
        will-change:transform}
      #s05-root .src img{width:46px;height:46px;display:block;flex:0 0 auto}
      #s05-root .src span{font-size:26px;font-weight:550;letter-spacing:-.01em}
      #s05-root .src.agent{border-color:rgba(190,205,255,.4);
        background:linear-gradient(180deg,rgba(150,175,255,.22),rgba(255,255,255,.05))}

      #s05-root .panel{position:absolute;left:552px;top:214px;width:368px;height:372px;border-radius:34px;
        padding:34px 32px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
        border:1px solid rgba(255,255,255,.22);
        box-shadow:0 46px 90px -34px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.36);
        backdrop-filter:blur(16px);will-change:transform}
      #s05-root .panel h4{margin:0;font-size:27px;font-weight:600;letter-spacing:-.01em}
      #s05-root .panel p{margin:12px 0 0;font-size:20px;font-weight:450;line-height:1.4;
        color:rgba(206,220,250,.74)}
      #s05-root .bars{margin-top:30px}
      #s05-root .bar{height:14px;border-radius:8px;margin-bottom:16px;
        background:linear-gradient(90deg,rgba(150,190,255,.9),rgba(150,190,255,.25));
        transform-origin:0% 50%;will-change:transform}
      #s05-root .panel .done{margin-top:24px;font-size:21px;font-weight:550;color:#8FE3AE}
    </style>

    <div class="frame clip" id="s05-frame" data-layout-allow-overflow data-start="0" data-duration="8.5" data-track-index="1">
      <div class="head">
        <div class="num" id="s05-num">2) Import Context</div>
        <div class="title" id="s05-title">Nothing starts<br>from zero.</div>
        <div class="rule" id="s05-rule"></div>
        <div class="sub" id="s05-sub">Bring the agent you already talk to, then wire in the notes, calendars, threads and browser profile it should have known all along.</div>
      </div>

      <div class="diagram">
        <svg class="wires" id="s05-wires" viewBox="0 0 920 800" fill="none" aria-hidden="true"></svg>

        <div class="src agent" data-src style="top:14px"><img src="logos/openai.svg" alt=""><span>ChatGPT</span></div>
        <div class="src agent" data-src style="top:126px"><img src="logos/claude.svg" alt=""><span>Claude &amp; your agent</span></div>
        <div class="src" data-src style="top:280px"><img src="logos/glyph-notes.svg" alt=""><span>Notes</span></div>
        <div class="src" data-src style="top:392px"><img src="logos/calendar.svg" alt=""><span>Calendar</span></div>
        <div class="src" data-src style="top:504px"><img src="logos/imessage.svg" alt=""><span>iMessage</span></div>
        <div class="src" data-src style="top:616px"><img src="logos/chrome.svg" alt=""><span>Chrome profile</span></div>

        <div class="panel" id="s05-panel">
          <h4>air context</h4>
          <p>One private index your agent reasons over.</p>
          <div class="bars">
            <div class="bar" data-bar style="width:100%"></div>
            <div class="bar" data-bar style="width:84%"></div>
            <div class="bar" data-bar style="width:66%"></div>
            <div class="bar" data-bar style="width:48%"></div>
          </div>
          <div class="done" id="s05-done">6 sources imported</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-05-import-context"]');
      var frame = root.querySelector('#s05-frame');
      var head = [root.querySelector('#s05-num'),root.querySelector('#s05-title'),
                  root.querySelector('#s05-rule'),root.querySelector('#s05-sub')];
      var srcs = root.querySelectorAll('.src');
      var panel = root.querySelector('#s05-panel');
      var bars = root.querySelectorAll('.bar');
      var done = root.querySelector('#s05-done');
      var svg = root.querySelector('#s05-wires');
      var EO = 'expo.out';
      var SVGNS = 'http://www.w3.org/2000/svg';

      // one wire per source, curving into the left edge of the context panel
      var TX = 552, TY = 400;
      var paths = [];
      for (var i = 0; i < srcs.length; i++){
        var y = parseFloat(srcs[i].style.top) + 46;
        var p = document.createElementNS(SVGNS,'path');
        p.setAttribute('d','M330 '+y+' C 430 '+y+', 452 '+TY+', '+TX+' '+TY);
        p.setAttribute('stroke', i < 2 ? 'rgba(176,196,255,.85)' : 'rgba(150,190,255,.55)');
        p.setAttribute('stroke-width','2.5');
        p.setAttribute('fill','none');
        svg.appendChild(p);
        paths.push(p);
      }

      gsap.set(head,{y:52,opacity:0});
      gsap.set(srcs,{x:120,opacity:0});
      gsap.set(panel,{scale:.9,opacity:0,transformOrigin:'50% 50%'});
      gsap.set(bars,{scaleX:0,opacity:.6,transformOrigin:'0% 50%'});
      gsap.set(done,{y:14,opacity:0});
      paths.forEach(function(p){
        var L = p.getTotalLength ? p.getTotalLength() : 400;
        gsap.set(p,{strokeDasharray:L,strokeDashoffset:L,opacity:.9});
      });

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.66},.28 + i*.13); });

      tl.to(panel,{scale:1,opacity:1,duration:.9},.66);

      // the two agents arrive first, then the four context sources, each wire drawing on arrival
      var order = [0,1,2,3,4,5];
      order.forEach(function(idx,k){
        var at = 1.00 + (k < 2 ? k*.34 : .74 + (k-2)*.44);
        tl.to(srcs[idx],{x:0,opacity:1,duration:.62},at);
        tl.to(paths[idx],{strokeDashoffset:0,duration:.66,ease:'power2.inOut'},at+.16);
        if (bars[k-2]) tl.to(bars[k-2],{scaleX:1,duration:.6},at+.42);
      });

      tl.to(done,{y:0,opacity:1,duration:.6},4.90);

      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},8.16);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},8.28);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-05-import-context"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
