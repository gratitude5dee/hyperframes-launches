<template id="sky-template">
  <div id="sky-root" data-composition-id="sky" data-width="1920" data-height="1080" data-duration="108">
    <style>
      #sky-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050810}
      #sky-root *,#sky-root *::before,#sky-root *::after{box-sizing:border-box}
      #sky-root #sky-canvas{position:absolute;inset:0;width:1920px;height:1080px;display:block}
      /* film grain + vignette so the sky sits under type without banding */
      #sky-root .veil{position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 38%,rgba(4,7,14,.55) 100%)}
    </style>

    <canvas id="sky-canvas" width="1920" height="1080" class="clip"
      data-start="0" data-duration="108" data-track-index="0"></canvas>
    <div class="veil"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="sky"]');
      var canvas = root.querySelector('#sky-canvas');
      var tl = gsap.timeline({paused:true});
      window.__timelines = window.__timelines || {};

      // uProgress: 0 = bright, cloud-lit morning sky (intro) -> 1 = darker, veiled dusk (outro).
      // Keyed to the master cut list: intro 0-17s, mid film hidden behind opaque shots,
      // outro sky returns at 86.5s and closes at 108s.
      var proxy = {t:0, p:0};

      function fallback2d(){
        var ctx = canvas.getContext('2d');
        if(!ctx) return false;
        var draw = function(p){
          var g = ctx.createLinearGradient(0,0,0,1080);
          var top = p < .5 ? '#0B1B3A' : '#060C1C';
          var mid = p < .5 ? '#3D7FC4' : '#1E3D66';
          var low = p < .5 ? '#A9CBEE' : '#3A5B84';
          g.addColorStop(0, top); g.addColorStop(.55, mid); g.addColorStop(1, low);
          ctx.fillStyle = g; ctx.fillRect(0,0,1920,1080);
          var sun = ctx.createRadialGradient(1260,340,20,1260,340,760);
          sun.addColorStop(0, 'rgba(255,241,214,'+(0.95-0.55*p)+')');
          sun.addColorStop(.28,'rgba(255,214,160,'+(0.35-0.22*p)+')');
          sun.addColorStop(1,  'rgba(255,214,160,0)');
          ctx.fillStyle = sun; ctx.fillRect(0,0,1920,1080);
        };
        draw(0);
        tl.to(proxy,{p:1,duration:108,ease:'none',onUpdate:function(){draw(proxy.p);}},0);
        return true;
      }

      var gl = canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true})
            || canvas.getContext('experimental-webgl',{antialias:false,preserveDrawingBuffer:true});

      if(!gl){
        fallback2d();
        window.__timelines["sky"] = tl;
        return;
      }

      var VS = [
        'attribute vec2 aPos;',
        'void main(){ gl_Position = vec4(aPos,0.0,1.0); }'
      ].join('\n');

      var FS = [
        'precision highp float;',
        'uniform vec2  uRes;',
        'uniform float uTime;',
        'uniform float uProgress;',
        // deterministic value noise + fBm (no randomness, no time-of-day input)
        'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }',
        'float noise(vec2 p){',
        '  vec2 i=floor(p), f=fract(p);',
        '  vec2 u=f*f*(3.0-2.0*f);',
        '  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));',
        '  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);',
        '}',
        'float fbm(vec2 p){',
        '  float v=0.0, a=0.5;',
        '  mat2 rot=mat2(0.8,0.6,-0.6,0.8);',
        '  for(int i=0;i<6;i++){ v+=a*noise(p); p=rot*p*2.02; a*=0.5; }',
        '  return v;',
        '}',
        'void main(){',
        '  vec2 uv = gl_FragCoord.xy/uRes;',
        '  vec2 p  = vec2(uv.x*uRes.x/uRes.y, uv.y);',
        '  float dusk = uProgress;',
        // sky body: deep navy zenith -> sky blue horizon, desaturating into dusk
        '  vec3 zenith   = mix(vec3(0.043,0.106,0.227), vec3(0.020,0.043,0.106), dusk);',
        '  vec3 horizon  = mix(vec3(0.663,0.796,0.933), vec3(0.208,0.325,0.475), dusk);',
        '  vec3 col = mix(horizon, zenith, pow(uv.y,0.85));',
        // sun disc + bloom, sitting high-right; sinks and cools as uProgress rises
        // high in the upper-right corner: centred type reads under it, and the leftward
        // cloud drift carries its bloom away from the frame's copy column
        '  vec2 sun = vec2(0.82*uRes.x/uRes.y, mix(0.80,0.62,dusk));',
        '  float sd = distance(p, sun);',
        '  vec3 sunCol = mix(vec3(1.0,0.945,0.851), vec3(1.0,0.784,0.596), dusk);',
        '  col += sunCol*(1.0-dusk*0.55)*exp(-sd*7.0)*0.85;',
        '  col += sunCol*(1.0-dusk*0.70)*exp(-sd*2.1)*0.30;',
        // cloud field: two fBm layers drifting LEFT (the film current) at different speeds
        '  vec2 q = p*vec2(2.4,3.2);',
        '  float drift = uTime*0.035;',
        '  float lowCloud = fbm(q + vec2(-drift*1.00, uTime*0.010) + fbm(q*0.5 - drift*0.4));',
        '  float hiCloud  = fbm(q*1.9 + vec2(-drift*1.75, -uTime*0.014));',
        '  float cloud = smoothstep(0.42,0.86, lowCloud*0.72 + hiCloud*0.36);',
        '  cloud *= smoothstep(0.02,0.42,uv.y);',
        '  float lit = smoothstep(0.9,0.0,sd);',
        '  vec3 cloudLo = mix(vec3(0.353,0.443,0.573), vec3(0.129,0.176,0.267), dusk);',
        '  vec3 cloudHi = mix(vec3(1.0,0.988,0.965), vec3(0.596,0.651,0.749), dusk);',
        '  vec3 cloudCol = mix(cloudLo, cloudHi, lit*0.85+0.15);',
        '  col = mix(col, cloudCol, cloud*(0.88-0.22*dusk));',
        // god rays: fBm sampled along the sun vector, gated by cloud breaks
        '  vec2 dir = normalize(p - sun);',
        // sampled on the direction vector itself, not on atan(): atan wraps at +-pi and
        // stamps a hard seam straight across the frame through the sun
        '  float rays = fbm(dir*6.5 + vec2(0.0, uTime*0.05));',
        '  rays = pow(smoothstep(0.35,0.95,rays), 1.6);',
        '  float reach = exp(-sd*1.25);',
        '  col += sunCol*rays*reach*(0.42-0.26*dusk);',
        // veil that closes the film: a soft dark wash pulled up from the frame edges
        '  float vig = smoothstep(1.15,0.15,distance(uv,vec2(0.5,0.46)));',
        '  col *= mix(1.0, 0.62, dusk*(1.0-vig*0.45));',
        '  col = mix(col, vec3(0.016,0.027,0.055), dusk*0.30);',
        // ordered dither to kill banding in the large gradients
        '  float dth = (hash(floor(gl_FragCoord.xy))-0.5)/255.0;',
        '  gl_FragColor = vec4(pow(max(col+dth,0.0), vec3(0.9545)), 1.0);',
        '}'
      ].join('\n');

      function compile(type, src){
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
        return s;
      }
      var vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, FS);
      var prog = vs && fs ? gl.createProgram() : null;
      if(prog){
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) prog = null;
      }
      if(!prog){
        fallback2d();
        window.__timelines["sky"] = tl;
        return;
      }

      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(prog,'uRes');
      var uTime = gl.getUniformLocation(prog,'uTime');
      var uProg = gl.getUniformLocation(prog,'uProgress');
      gl.viewport(0,0,1920,1080);

      // time comes from the seeked timeline only — never a wall clock
      function renderFrame(t, p){
        gl.uniform2f(uRes, 1920, 1080);
        gl.uniform1f(uTime, t);
        gl.uniform1f(uProg, p);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      renderFrame(0, 0);

      tl.to(proxy,{t:108,duration:108,ease:'none',onUpdate:function(){renderFrame(proxy.t, proxy.p);}},0);
      // bright -> settled through the intro, then the long veil into the outro,
      // as one tween so the three legs cannot overlap on the same property
      tl.to(proxy,{ease:'none',keyframes:[
        {p:0.18,duration:17,ease:'none'},
        {p:0.42,duration:69.5,ease:'none'},
        {p:0.86,duration:21.5,ease:'power1.inOut'}
      ]},0);

      window.__timelines["sky"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
