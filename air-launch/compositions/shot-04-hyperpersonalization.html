<template id="shot-04-hyperpersonalization-template">
  <div id="s04-root" data-composition-id="shot-04-hyperpersonalization" data-width="1920" data-height="1080" data-duration="7.7">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;
        src:url(fonts/Inter-latin-variable.woff2) format('woff2')}

      #s04-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050810;
        font-family:'Inter var',system-ui,sans-serif;color:#EDF3FF;
        -webkit-font-smoothing:antialiased}
      #s04-root *,#s04-root *::before,#s04-root *::after{box-sizing:border-box}

      #s04-root .frame{position:absolute;inset:0;background:
        radial-gradient(60% 60% at 68% 50%,rgba(122,96,214,.32) 0%,rgba(5,8,16,0) 68%),
        radial-gradient(70% 60% at 12% 10%,rgba(46,92,170,.26) 0%,rgba(5,8,16,0) 70%),
        #050810}

      #s04-root .head{position:absolute;left:150px;top:190px;width:640px}
      #s04-root .num{display:inline-block;font-size:26px;font-weight:600;letter-spacing:.34em;
        text-transform:uppercase;color:#A9C6FF}
      #s04-root .title{margin-top:26px;font-size:96px;font-weight:600;letter-spacing:-.04em;line-height:1.02}
      #s04-root .sub{margin-top:34px;font-size:32px;font-weight:450;line-height:1.45;
        color:rgba(226,236,255,.78);max-width:560px}
      #s04-root .rule{margin-top:38px;width:180px;height:3px;
        background:linear-gradient(90deg,rgba(169,198,255,.95),rgba(169,198,255,0))}

      #s04-root .hubwrap{position:absolute;left:1000px;top:0;width:920px;height:1080px}
      /* orbit centre lands at x=1440 (wrap 1000 + 30 + CX 410): radius 330 plus a 75px
         tile half-width has to stay inside the 1920 frame */
      /* not a stacking context: tiles interleave with the hub by z-index (front/behind) */
      #s04-root .orbit{position:absolute;left:30px;top:130px;width:820px;height:820px}
      #s04-root .ring{position:absolute;border-radius:50%;border:1px solid rgba(180,205,255,.20)}
      #s04-root .ring.r1{left:150px;top:150px;width:520px;height:520px}
      #s04-root .ring.r2{left:40px;top:40px;width:740px;height:740px;
        border-color:rgba(180,205,255,.12)}
      #s04-root .node{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;
        border-radius:38px;display:grid;place-items:center;
        background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));
        border:1px solid rgba(255,255,255,.24);
        box-shadow:0 30px 60px -22px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.4);
        will-change:transform,filter,opacity}
      #s04-root .node img{width:76px;height:76px;display:block}
      #s04-root .mote{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;
        border-radius:50%;background:#CDBBFF;box-shadow:0 0 14px rgba(170,140,255,.9);
        opacity:0;z-index:5;will-change:transform,opacity}

      /* centred on the orbit centre (orbit left + CX), not on the wrapper */
      #s04-root .hub{position:absolute;left:440px;top:540px;width:300px;height:300px;
        margin:-150px 0 0 -150px;border-radius:50%;display:grid;place-items:center;
        background:radial-gradient(circle at 50% 34%,rgba(150,126,255,.42),rgba(24,20,54,.9));
        border:1px solid rgba(190,175,255,.42);
        box-shadow:0 40px 90px -30px rgba(70,40,180,.7),inset 0 1px 0 rgba(255,255,255,.35);
        z-index:4;will-change:transform}
      #s04-root .hub img{width:216px;height:216px;display:block;border-radius:50%;object-fit:cover;
        object-position:50% 18%}
      /* below the outermost tile path (centre 540 + radius 330 + half tile 75) so nothing sweeps over it */
      #s04-root .hublabel{position:absolute;left:250px;top:956px;width:380px;text-align:center;
        font-size:28px;font-weight:550;letter-spacing:.02em;color:rgba(232,238,255,.92)}
      #s04-root .hublabel small{display:block;margin-top:10px;font-size:21px;font-weight:450;
        color:rgba(200,214,246,.7);letter-spacing:.14em;text-transform:uppercase}
    </style>

    <div class="frame clip" id="s04-frame" data-layout-allow-overflow data-start="0" data-duration="7.7" data-track-index="1">
      <div class="head">
        <div class="num" id="s04-num">1) Hyperpersonalization</div>
        <div class="title" id="s04-title">It learns the<br>shape of you.</div>
        <div class="rule" id="s04-rule"></div>
        <div class="sub" id="s04-sub">Your taste graph — what you play, watch and rewatch — resolved into one persona your agent can reason over.</div>
      </div>

      <div class="hubwrap">
        <div class="ring r1" id="s04-ring1"></div>
        <div class="ring r2" id="s04-ring2"></div>
        <div class="orbit" id="s04-orbit">
          <div class="node" data-node><img src="logos/spotify.svg" alt=""></div>
          <div class="node" data-node><img src="logos/netflix.svg" alt=""></div>
          <div class="node" data-node><img src="logos/youtube.svg" alt=""></div>
          <div class="mote" data-mote></div><div class="mote" data-mote></div>
          <div class="mote" data-mote></div><div class="mote" data-mote></div>
          <div class="mote" data-mote></div><div class="mote" data-mote></div>
        </div>
        <div class="hub" id="s04-hub"><img src="logos/onairos-avatar.png" alt=""></div>
        <div class="hublabel" id="s04-hublabel">Onairos persona<small>one graph, one person</small></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-04-hyperpersonalization"]');
      var frame = root.querySelector('#s04-frame');
      var head = [root.querySelector('#s04-num'),root.querySelector('#s04-title'),
                  root.querySelector('#s04-rule'),root.querySelector('#s04-sub')];
      var orbit = root.querySelector('#s04-orbit');
      var nodes = root.querySelectorAll('#s04-orbit .node');
      var hub = root.querySelector('#s04-hub');
      var hublabel = root.querySelector('#s04-hublabel');
      var rings = [root.querySelector('#s04-ring1'),root.querySelector('#s04-ring2')];
      var EO = 'expo.out';

      var motes = root.querySelectorAll('#s04-orbit .mote');

      // tilted 3D orbit — an ellipse seen at ~28 degrees: full radius in x, squashed in y,
      // with depth read straight off sin(angle): far tiles shrink, dim and soften behind
      // the persona, near tiles pass in front of it. All trig, no randomness.
      var CX = 410, CY = 410, RX = 340, RY = 132;
      function place(node, deg, reveal){
        var a = deg * Math.PI/180;
        var depth = Math.sin(a);            // -1 far (behind hub) .. +1 near (in front)
        var s = 0.72 + 0.34*(depth+1)/2;    // 0.72 far .. 1.06 near
        gsap.set(node,{
          left: CX + RX*Math.cos(a),
          top:  CY + RY*Math.sin(a) + 130,  // ellipse band sits on the hub's equator
          scale: s * (0.6 + 0.4*reveal),
          zIndex: depth > 0 ? 6 : 2,
          filter: 'blur(' + (depth > 0 ? 0 : (1.6*(-depth))).toFixed(2) + 'px)',
          opacity: reveal * Math.min(1, 0.55 + 0.45*(depth+1)/2)
        });
      }

      gsap.set(head,{y:52,opacity:0});
      gsap.set(rings,{scale:.72,opacity:0,transformOrigin:'50% 50%'});
      gsap.set(rings,{scaleY:.42});   // rings echo the orbit's tilt
      gsap.set(hub,{scale:.6,opacity:0});
      gsap.set(hublabel,{y:26,opacity:0});

      var spin = {r:0, reveal:0};
      function applySpin(){ // pure function of (spin.r, spin.reveal) — seek-safe
        for (var k = 0; k < nodes.length; k++){
          place(nodes[k], -90 + k*120 + spin.r, spin.reveal);
        }
        // taste-graph motes: each streams from its tile's track inward to the persona,
        // on a fixed phase — pure functions of the same clock
        for (var m = 0; m < motes.length; m++){
          var ph = (spin.r*1.6 + m*60) % 360;
          var f = ph/360;                       // 0 at tile track, 1 at hub centre
          var a = (-90 + m*60) * Math.PI/180;
          gsap.set(motes[m],{
            left: CX + RX*Math.cos(a)*(1-f),
            top:  CY + 130 + RY*Math.sin(a)*(1-f) - 130*f*(1-f),
            opacity: spin.reveal * Math.sin(f*Math.PI) * .9,
            scale: 1.4 - f
          });
        }
      }

      applySpin();

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);

      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.66},.08 + i*.11); });

      tl.to(rings,{scale:1,opacity:1,duration:1.1,stagger:.09,overwrite:'auto'},.62);
      tl.to(hub,{scale:1,opacity:1,duration:.9,overwrite:'auto'},.80);
      tl.to(hublabel,{y:0,opacity:1,duration:.7,overwrite:'auto'},1.20);
      // the tilted carousel: one continuous turn drives tile depth, motes and reveal
      tl.to(spin,{r:150,duration:6.4,ease:'sine.inOut',onUpdate:applySpin},1.10);
      tl.to(spin,{reveal:1,duration:.9,ease:'power2.out',onUpdate:applySpin},1.60);
      // the hub breathes once per bar (~2.9s at 83.4 BPM)
      tl.to(hub,{scale:1.05,duration:1.44,ease:'sine.inOut',repeat:2,yoyo:true,overwrite:'auto'},2.0);

      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.36);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.48);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-04-hyperpersonalization"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
