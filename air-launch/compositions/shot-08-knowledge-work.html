<template id="shot-08-knowledge-work-template">
  <div id="s08-root" data-composition-id="shot-08-knowledge-work" data-width="1920" data-height="1080" data-duration="9">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;
        src:url(fonts/Inter-latin-variable.woff2) format('woff2')}

      #s08-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050810;
        font-family:'Inter var',system-ui,sans-serif;color:#EDF3FF;
        -webkit-font-smoothing:antialiased}
      #s08-root *,#s08-root *::before,#s08-root *::after{box-sizing:border-box}

      #s08-root .frame{position:absolute;inset:0;background:
        radial-gradient(58% 56% at 72% 44%,rgba(44,116,168,.28) 0%,rgba(5,8,16,0) 70%),
        radial-gradient(56% 48% at 6% 92%,rgba(96,80,196,.20) 0%,rgba(5,8,16,0) 74%),
        #050810}

      #s08-root .head{position:absolute;left:150px;top:250px;width:560px}
      #s08-root .num{font-size:26px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#A9C6FF}
      #s08-root .title{margin-top:26px;font-size:88px;font-weight:600;letter-spacing:-.04em;line-height:1.04}
      #s08-root .rule{margin-top:36px;width:180px;height:3px;
        background:linear-gradient(90deg,rgba(169,198,255,.95),rgba(169,198,255,0))}
      #s08-root .sub{margin-top:34px;font-size:30px;font-weight:450;line-height:1.45;color:rgba(226,236,255,.78)}

      /* chat surface — modelled on the buoy.chat single-column agent thread */
      #s08-root .surface{position:absolute;left:840px;top:110px;width:960px;height:884px;border-radius:44px;
        padding:34px 36px 36px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
        border:1px solid rgba(255,255,255,.20);
        box-shadow:0 60px 120px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.36);
        backdrop-filter:blur(18px);will-change:transform}
      #s08-root .bar{display:flex;align-items:center;gap:14px;padding-bottom:26px;
        border-bottom:1px solid rgba(255,255,255,.12)}
      #s08-root .bar img{width:34px;height:34px;display:block}
      #s08-root .bar span{font-size:23px;font-weight:550;letter-spacing:.02em;color:rgba(226,236,255,.82)}
      #s08-root .prompt{margin:26px 0 6px;margin-left:auto;width:600px;border-radius:26px 26px 8px 26px;
        padding:22px 26px;font-size:24px;font-weight:500;line-height:1.35;color:#08101F;
        background:linear-gradient(180deg,#DCEBFF,#B7D5FF);box-shadow:0 20px 40px -18px rgba(0,0,0,.6);
        will-change:transform}
      #s08-root .rows{margin-top:20px}
      #s08-root .row{display:flex;align-items:center;gap:20px;height:86px;padding:0 22px;
        border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
        margin-bottom:12px;will-change:transform}
      #s08-root .row img{width:42px;height:42px;display:block;flex:0 0 auto}
      #s08-root .row b{font-size:26px;font-weight:520;letter-spacing:-.01em}
      #s08-root .row .tick{margin-left:auto;width:44px;height:44px;flex:0 0 auto}
      #s08-root .row.soon{border-style:dashed;border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.03)}
      #s08-root .row.soon b{color:rgba(226,236,255,.72)}
      #s08-root .row .soonpill{margin-left:auto;padding:9px 18px;border-radius:999px;font-size:18px;
        font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#FFD79E;
        border:1px solid rgba(255,201,120,.6);background:rgba(255,201,120,.12)}
    </style>

    <div class="frame clip" id="s08-frame" data-layout-allow-overflow data-start="0" data-duration="9" data-track-index="1">
      <div class="head">
        <div class="num" id="s08-num">5) Knock off Knowledge Work</div>
        <div class="title" id="s08-title">The work you<br>never chose.</div>
        <div class="rule" id="s08-rule"></div>
        <div class="sub" id="s08-sub">One thread. Your agent does the rest — and reports back when it's done.</div>
      </div>

      <div class="surface" id="s08-surface">
        <div class="bar"><img src="logos/air.svg" alt=""><span>air — your agent</span></div>
        <div class="prompt" id="s08-prompt">Clear my inbox, hold 8pm Friday, and restock the shop.</div>
        <div class="rows" id="s08-rows">
          <div class="row" data-row><img src="logos/glyph-mail.svg" alt=""><b>write emails</b>
            <svg class="tick" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="20" stroke="rgba(143,227,174,.45)" stroke-width="2"/><path d="m13 22.6 6 6L31.4 16" stroke="#8FE3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="row" data-row><img src="logos/glyph-calendar-check.svg" alt=""><b>check calendar &amp; appointments</b>
            <svg class="tick" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="20" stroke="rgba(143,227,174,.45)" stroke-width="2"/><path d="m13 22.6 6 6L31.4 16" stroke="#8FE3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="row" data-row><img src="logos/glyph-cart.svg" alt=""><b>book reservations &amp; personal shopping</b>
            <svg class="tick" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="20" stroke="rgba(143,227,174,.45)" stroke-width="2"/><path d="m13 22.6 6 6L31.4 16" stroke="#8FE3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="row" data-row><img src="logos/glyph-shop.svg" alt=""><b>manage business &amp; online shop</b>
            <svg class="tick" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="20" stroke="rgba(143,227,174,.45)" stroke-width="2"/><path d="m13 22.6 6 6L31.4 16" stroke="#8FE3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="row" data-row><img src="logos/glyph-miniapp.svg" alt=""><b>build &amp; share custom miniapps</b>
            <svg class="tick" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="20" stroke="rgba(143,227,174,.45)" stroke-width="2"/><path d="m13 22.6 6 6L31.4 16" stroke="#8FE3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="row soon" data-row><img src="logos/glyph-computer.svg" alt=""><b>desktop app &amp; local computer use</b>
            <span class="soonpill">coming soon</span></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-08-knowledge-work"]');
      var frame = root.querySelector('#s08-frame');
      var head = [root.querySelector('#s08-num'),root.querySelector('#s08-title'),
                  root.querySelector('#s08-rule'),root.querySelector('#s08-sub')];
      var surface = root.querySelector('#s08-surface');
      var prompt = root.querySelector('#s08-prompt');
      var rows = root.querySelectorAll('#s08-rows .row');
      var ticks = root.querySelectorAll('#s08-rows .tick path');
      var EO = 'expo.out';

      gsap.set(head,{y:52,opacity:0});
      gsap.set(surface,{y:70,opacity:0,scale:.96,transformOrigin:'50% 50%'});
      gsap.set(prompt,{y:30,opacity:0,scale:.96,transformOrigin:'100% 100%'});
      gsap.set(rows,{y:56,opacity:0});
      ticks.forEach(function(p){
        var L = p.getTotalLength ? p.getTotalLength() : 40;
        gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});
      });

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.66},.26 + i*.13); });

      tl.to(surface,{y:0,opacity:1,scale:1,duration:.95},.50);
      tl.to(prompt,{y:0,opacity:1,scale:1,duration:.7},.92);

      // each task row arrives, then ticks itself off — the work resolving in reading order
      rows.forEach(function(r,i){
        var at = 1.42 + i*.62;
        tl.to(r,{y:0,opacity:1,duration:.62},at);
        if (ticks[i]) tl.to(ticks[i],{strokeDashoffset:0,duration:.42,ease:'power2.out'},at+.34);
      });

      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},8.66);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},8.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-08-knowledge-work"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
